                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* Controls: Filter */}
            <section className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-white p-2 rounded-xl shadow-sm border border-slate-200">
               <div className="flex items-center gap-2 px-3 text-slate-600 font-medium">
                 <User className="h-5 w-5" />
                 <span>{t('filterLabel')}</span>
               </div>
               <div className="flex flex-wrap gap-2 p-1 w-full sm:w-auto">
                 {['All', 'Tyler', 'Sophia', 'Irene'].map(person => (
                   <button
                     key={person}
                     onClick={() => setSelectedPerson(person)}
                     className={`px-4 py-2 rounded-lg text-sm font-medium transition-all flex-1 sm:flex-none ${
                       selectedPerson === person 
                        ? 'bg-sky-600 text-white shadow-md' 
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                     }`}
                   >
                     {person === 'All' ? t('filterAll') : person}
                   </button>
                 ))}
               </div>
            </section>

            {/* Schedule Tabs */}
            <section>
              <div className="flex overflow-x-auto hide-scrollbar gap-2 pb-2">
                {scheduleData.map((day) => (
                  <button
                    key={day.date}
                    onClick={() => setActiveDate(day.date)}
                    className={`flex flex-col items-center min-w-[70px] p-3 rounded-xl transition-all border ${
                      activeDate === day.date
                        ? 'bg-sky-600 border-sky-600 text-white shadow-md transform scale-105'
                        : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                    }`}
                  >
                    <span className="text-xs mb-1 opacity-80">{day.date}</span>
                    <span className="font-bold text-lg">{lang === 'en' ? day.dayEn : day.dayZh}</span>
                  </button>
                ))}
              </div>
            </section>

            {/* Schedule Content */}
            <section className="space-y-4">
              {filteredPeriods.length === 0 ? (
                <div className="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300">
                  <Info className="h-10 w-10 text-slate-300 mx-auto mb-3" />
                  <p className="text-slate-500">{t('emptySchedule')}</p>
                </div>
              ) : (
                filteredPeriods.map((period, pIdx) => (
                  <div key={pIdx} className="flex flex-col sm:flex-row gap-4 bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5 relative overflow-hidden">
                    
                    {/* Time Indicator */}
                    <div className="flex flex-row sm:flex-col items-center sm:items-start gap-2 sm:w-32 shrink-0 border-b sm:border-b-0 sm:border-r border-slate-100 pb-3 sm:pb-0 sm:pr-4">
                      <div className="bg-sky-100 text-sky-700 p-2 rounded-lg">
                        <Clock className="h-5 w-5" />
                      </div>
                      <div>
                        <h3 className="font-bold text-slate-800 whitespace-nowrap">
                          {lang === 'en' ? period.nameEn : period.nameZh}
                        </h3>
                        <p className="text-xs font-medium text-slate-500 mt-0.5">{period.time}</p>
                      </div>
                    </div>

                    {/* Event or Classes Content */}
                    <div className="flex-1">
                      {period.type === 'event' ? (
                        // General Event Render
                        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 h-full flex flex-col justify-center">
                          <div className="flex items-center gap-2 mb-2">
                            {period.titleEn.includes('Graduation') ? <GraduationCap className="h-5 w-5 text-amber-600" /> : 
                             period.titleEn.includes('Arrival') ? <Plane className="h-5 w-5 text-amber-600" /> :
                             period.titleEn.includes('Homestay') ? <Home className="h-5 w-5 text-amber-600" /> :
                             <MapPin className="h-5 w-5 text-amber-600" />}
                            <h4 className="font-bold text-lg text-amber-900">
                              {lang === 'en' ? period.titleEn : period.titleZh}
                            </h4>
                          </div>
                          <p className="text-amber-700 text-sm mb-3">
                            {lang === 'en' ? period.descEn : period.descZh}
                          </p>
                          <div className="flex items-center text-xs text-amber-600 font-medium">
                             <MapPin className="h-3 w-3 mr-1 inline" />
                             {lang === 'en' ? period.locationEn : period.locationZh}
                          </div>
                        </div>
                      ) : (
                        // Classes Render
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                          {period.classes.map((cls, cIdx) => (
                            <div key={cIdx} className="bg-slate-50 rounded-lg p-4 border border-slate-100 flex flex-col justify-between hover:border-sky-300 transition-colors">
                              <div>
                                <div className="flex justify-between items-start mb-2">
                                  <span className="inline-block bg-slate-200 text-slate-700 text-xs font-bold px-2 py-1 rounded">
                                    {t('class')} {cls.class}
                                  </span>
                                  <div className="flex flex-wrap gap-1 justify-end">
                                    {cls.foreigners.map(f => (
                                      <span key={f} className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${getPersonColor(f)}`}>
                                        {f}
                                      </span>
                                    ))}
                                  </div>
                                </div>
                                <h4 className="font-bold text-slate-800 flex items-center gap-2 mt-2">
                                  <BookOpen className="h-4 w-4 text-sky-600" />
                                  {lang === 'en' ? cls.subjectEn : cls.subjectZh}
                                </h4>
                              </div>
                              
                              <div className="mt-4 pt-3 border-t border-slate-200 flex items-center gap-2 text-sm text-slate-600">
                                 <User className="h-4 w-4" />
                                 <span>{t('teacher')}: <span className="font-medium text-slate-800">{cls.localTeacher}</span></span>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                ))
              )}
            </section>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
